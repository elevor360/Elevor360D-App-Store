<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Affiliate Shops | Elevor360D</title><style>body{font:16px system-ui;margin:0;background:#f1f5f9;color:#172b43}header{background:#17365d;color:white;padding:24px}header a{color:white}main{max-width:1200px;margin:auto;padding:20px}input,select{padding:12px;max-width:100%;margin:5px}#products{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}article{background:white;padding:16px;border-radius:12px;display:flex;flex-direction:column}article img{width:100%;height:200px;object-fit:contain}article a{background:#17365d;color:white;padding:12px;text-align:center;border-radius:8px;margin-top:auto}h3{font-size:17px}button{padding:12px;margin:12px}small{display:block}</style><header><a href="index.html">← Offers & Shopping</a><h1>Elevor360D Affiliate Shops</h1><p>Browse our retail partners</p></header><main><p><strong>Advertisement / affiliate disclosure:</strong> We may earn commission on qualifying purchases. Orders and returns are handled by the retailer. Check current prices and availability with the retailer.</p><div id="stores"></div><label>Retailer <select id="shop"></select></label><p id="status" role="status">Loading products…</p><label>Search <input id="q" type="search"></label><label>Category <select id="cat"><option value="">All categories</option></select></label><label>Sort <select id="sort"><option value="name">Name</option><option value="low">Price low to high</option><option value="high">Price high to low</option></select></label><div id="products"></div><button id="more" hidden>Show more products</button></main><script>const $=id=>document.getElementById(id);let all=[],limit=24;function render(){let q=$('q').value.toLowerCase(),c=$('cat').value;let rows=all.filter(p=>(!c||p.category===c)&&(p.name+' '+p.description).toLowerCase().includes(q));rows.sort((a,b)=>$('sort').value==='low'?Number(a.price)-Number(b.price):$('sort').value==='high'?Number(b.price)-Number(a.price):a.name.localeCompare(b.name));$('products').replaceChildren();for(const p of rows.slice(0,limit)){let card=document.createElement('article');if(p.image){let img=document.createElement('img');img.src=p.image;img.alt=p.name;img.loading='lazy';img.onerror=()=>img.remove();card.append(img)}for(const [tag,t] of [['h3',p.name],['strong',p.price&&Number.isFinite(Number(p.price))?'£'+Number(p.price).toFixed(2):'Check retailer price'],['p',p.description]]){let e=document.createElement(tag);e.textContent=t;card.append(e)}let a=document.createElement('a');a.href=p.url;a.target='_blank';a.rel='sponsored noopener noreferrer';a.textContent='View at retailer';card.append(a);$('products').append(card)}$('more').hidden=rows.length<=limit;if(!rows.length)$('products').textContent='No matching products.'}for(const id of ['q','cat','sort'])$(id).addEventListener('input',()=>{limit=24;render()});$('more').onclick=()=>{limit+=24;render()};let shops=[],request=0; async function load(){let n=++request,s=shops.find(x=>x.id===$('shop').value);all=[];limit=24;$('cat').replaceChildren(new Option('All categories',''));render();$('status').textContent='Loading catalogue…';if(!s)return;try{let r=await fetch(s.id+'-products.json',{cache:'no-cache'});if(!r.ok)throw Error();let d=await r.json();if(n!==request)return;all=d.products;$('status').textContent=s.name+' • '+all.length+' products • '+(d.updated?'Updated '+new Date(d.updated).toLocaleString('en-GB'):'Initial catalogue');for(let c of [...new Set(all.map(p=>p.category).filter(Boolean))].sort())$('cat').append(new Option(c,c));render()}catch(e){if(n===request)$('status').textContent='Catalogue not yet available. Please try again later.'}}$('shop').onchange=load;fetch('shops-config.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{shops=d.shops.filter(s=>s.enabled&&/^[a-z0-9-]+$/.test(s.id));for(let s of shops){$('shop').append(new Option(s.name+' — '+s.category,s.id));let b=document.createElement('button');b.textContent=s.name;b.onclick=()=>{$('shop').value=s.id;load()};for(let k of ['logo','banner'])if(/^images\/[a-zA-Z0-9._-]+$/.test(s[k]||'')){let im=document.createElement('img');im.src=s[k];im.alt=s.name;im.style.cssText='max-width:160px;max-height:80px;display:block';b.prepend(im)}$('stores').append(b)}if(shops.length)load();else $('status').textContent='No active shops.'}).catch(()=>{$('status').textContent='Shop directory unavailable.'});</script></html>
