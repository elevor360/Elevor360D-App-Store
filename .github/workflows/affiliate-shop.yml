name: Refresh affiliate shop
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: affiliate-shop-refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh catalogue
        env:
          SHOP_SECRETS: ${{ toJSON(secrets) }}
        run: python3 scripts/refresh_affiliate_shop.py
      - name: Save catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add affiliate-offers/*-products.json
          git diff --cached --quiet || (git commit -m 'Refresh affiliate catalogue' && git push)
      - name: Report failed feeds
        run: test ! -s /tmp/affiliate-failures
